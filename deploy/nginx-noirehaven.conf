# Freelancer Helper — reverse proxy for noirehaven.com → 127.0.0.1:3030
# Install: copy to /etc/nginx/sites-available/noirehaven.com and symlink sites-enabled
# Then: sudo certbot --nginx -d noirehaven.com -d www.noirehaven.com

upstream freelancer_helper {
    server 127.0.0.1:3030;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name noirehaven.com www.noirehaven.com;

    # Certbot will replace this with HTTPS redirect after issuance
    location / {
        proxy_pass http://freelancer_helper;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # SSE / EventSource — long-lived connection
    location /events {
        proxy_pass http://freelancer_helper;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

# After certbot, a 443 server block is added automatically. Ensure it keeps the
# same proxy headers and long timeouts for / and /events.
